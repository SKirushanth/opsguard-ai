name: OpsGuard CI and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      production: ${{ steps.paths.outputs.production }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify affected components
        id: paths
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,subprocess
          base=os.environ['BEFORE']
          if not base or set(base)=={'0'}:
              base='HEAD^'
          paths=subprocess.check_output(['git','diff','--name-only','-z',base,'HEAD']).decode().split('\0')
          def matches(*prefix): return any(p.startswith(prefix) for p in paths)
          flags={'frontend':matches('frontend/'),'backend':matches('backend/','.dockerignore','investigation.py'),
                 'agent':matches('agent/','requirements.txt','backend/requirements.txt','investigation.py')}
          print(flags)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('production='+str(any(flags.values()) or os.environ['EVENT']=='workflow_dispatch').lower(),file=f)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  production:
    needs: ci
    if: github.repository == 'SKirushanth/opsguard-ai' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.ci.outputs.production == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    concurrency:
      group: opsguard-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - run: |
          python -m pip install --quiet httpx==0.28.1 selenium==4.32.0
          az acr login --name opsguardacr39424 --output none
      - name: Activate changed components and verify
        env:
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          WSO2_VERIFIED_SHA: ${{ vars.WSO2_VERIFIED_SHA }}
        run: python -m deploy.pipeline.release
